# Free demonstration only. All account and trading data resets on restart.
server.port=${PORT:8080}
server.address=0.0.0.0
server.tomcat.threads.max=16
server.tomcat.threads.min-spare=2
spring.datasource.url=jdbc:h2:mem:trademind_demo;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=4
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.cache.type=simple
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data-dev.sql
spring.data.redis.repositories.enabled=false
jwt.secret=${JWT_SECRET}
ai.service.url=${AI_SERVICE_URL:http://localhost:5000}
cors.allowed-origins=${FRONTEND_URL:http://localhost:3000}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.redis.enabled=false
trademind.demo=true
