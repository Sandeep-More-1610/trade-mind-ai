# ── Server ──────────────────────────────────────────────────
server.port=8080

# ── MySQL ────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/trademind_db?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=your_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ── Redis Cache ──────────────────────────────────────────────
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis
spring.cache.redis.time-to-live=60000

# ── JWT ──────────────────────────────────────────────────────
jwt.secret=TradeMindSuperSecretKey2024PleaseChangeThisInProduction!
jwt.expiration=86400000

# ── Python AI Microservice ───────────────────────────────────
ai.service.url=http://localhost:5000

# ── External APIs ────────────────────────────────────────────
finnhub.api.key=your_finnhub_key
newsapi.key=your_newsapi_key

# ── CORS ─────────────────────────────────────────────────────
cors.allowed-origins=http://localhost:3000,https://trademind.vercel.app

# ── Actuator ─────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
