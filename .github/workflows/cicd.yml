name: TradeMind AI — CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-ai-service:
    name: 🧪 Test Python AI Service
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ai-service
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      CUDA_VISIBLE_DEVICES: "-1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # CPU wheels avoid downloading several GB of unused CUDA libraries.
      - name: Install CPU PyTorch
        run: python -m pip install --no-cache-dir torch==2.1.2 --index-url https://download.pytorch.org/whl/cpu
      - name: Install dependencies
        run: python -m pip install --no-cache-dir -r requirements.txt
      - name: Test free demo without ML dependencies
        run: python -m unittest test_demo.py
      - name: Run Flask health test
        run: |
          python - <<'PY'
          from app import app
          response = app.test_client().get('/health')
          assert response.status_code == 200
          assert response.get_json()['status'] == 'ok'
          print('AI service imported successfully and health check passed')
          PY

  test-backend:
    name: 🧪 Test Spring Boot Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Build and test backend
        run: mvn --batch-mode --no-transfer-progress verify

  build-frontend:
    name: 🏗️ Build React Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build production bundle
        env:
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}
        run: npm run build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build/
          if-no-files-found: error
          retention-days: 7

  deployment-config:
    name: Check deployment configuration
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      frontend: ${{ steps.config.outputs.frontend }}
      backend: ${{ steps.config.outputs.backend }}
      ai: ${{ steps.config.outputs.ai }}
    steps:
      - name: Check configured credentials
        id: config
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}
          BACKEND_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          AI_HOOK: ${{ secrets.RENDER_AI_DEPLOY_HOOK }}
        run: |
          frontend=false; backend=false; ai=false
          if [[ -n "$VERCEL_TOKEN" && -n "$VERCEL_ORG_ID" && -n "$VERCEL_PROJECT_ID" && -n "$REACT_APP_API_URL" ]]; then frontend=true; fi
          if [[ -n "$BACKEND_HOOK" ]]; then backend=true; fi
          if [[ -n "$AI_HOOK" ]]; then ai=true; fi
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "ai=$ai" >> "$GITHUB_OUTPUT"
          echo "Deployment configured — frontend: $frontend, backend: $backend, AI: $ai" >> "$GITHUB_STEP_SUMMARY"

  deploy-frontend:
    name: 🚀 Deploy Frontend → Vercel
    needs: [build-frontend, test-backend, test-ai-service, deployment-config]
    runs-on: ubuntu-latest
    if: needs.deployment-config.outputs.frontend == 'true'
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Vercel CLI
        run: npm install -g vercel
      - name: Deploy to Vercel
        working-directory: frontend
        run: |
          vercel pull --yes --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

  deploy-backend:
    name: 🚀 Deploy Backend → Render
    needs: [build-frontend, test-backend, test-ai-service, deployment-config]
    runs-on: ubuntu-latest
    if: needs.deployment-config.outputs.backend == 'true'
    steps:
      - name: Trigger Render deploy
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl --fail --show-error --silent --request POST "$DEPLOY_HOOK"

  deploy-ai:
    name: 🚀 Deploy AI Service → Render
    needs: [build-frontend, test-backend, test-ai-service, deployment-config]
    runs-on: ubuntu-latest
    if: needs.deployment-config.outputs.ai == 'true'
    steps:
      - name: Trigger Render deploy
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_AI_DEPLOY_HOOK }}
        run: curl --fail --show-error --silent --request POST "$DEPLOY_HOOK"
