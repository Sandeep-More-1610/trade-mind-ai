name: TradeMind AI — CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-ai-service:
    name: 🧪 Test Python AI Service
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ai-service
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      CUDA_VISIBLE_DEVICES: "-1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # CPU wheels avoid downloading several GB of unused CUDA libraries.
      - name: Install CPU PyTorch
        run: python -m pip install --no-cache-dir torch==2.1.2 --index-url https://download.pytorch.org/whl/cpu
      - name: Install dependencies
        run: python -m pip install --no-cache-dir -r requirements.txt
      - name: Test free demo without ML dependencies
        run: python -m unittest test_demo.py
      - name: Run Flask health test
        run: |
          python - <<'PY'
          from app import app
          response = app.test_client().get('/health')
          assert response.status_code == 200
          assert response.get_json()['status'] == 'ok'
          print('AI service imported successfully and health check passed')
          PY

  test-backend:
    name: 🧪 Test Spring Boot Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Build and test backend
        run: mvn --batch-mode --no-transfer-progress verify

  build-frontend:
    name: 🏗️ Build React Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build production bundle
        env:
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}
        run: npm run build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build/
          if-no-files-found: error
          retention-days: 7

